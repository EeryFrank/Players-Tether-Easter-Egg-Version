plugins {
    id "base"
    id "dev.architectury.loom" version "1.11.456" apply false
}

def packagedLegalFiles = [
        'META-INF/LICENSE-qizhang_player_leash-LGPL-3.0-or-later.txt': file('LICENSE'),
        'META-INF/LICENSE-qizhang_player_leash-MIT.txt': file('LICENSES/MIT.txt'),
        'META-INF/LICENSE-qizhang_player_leash-CC-BY-SA-4.0.txt': file('LICENSES/CC-BY-SA-4.0.txt'),
        'META-INF/LICENSE-third-party-Apache-2.0.txt': file('LICENSES/Apache-2.0.txt'),
        'META-INF/LICENSE-POLICY-qizhang_player_leash.md': file('LICENSE_POLICY.md'),
        'META-INF/ASSET-LICENSES-qizhang_player_leash.md': file('ASSET_LICENSES.md'),
        'META-INF/THIRD-PARTY-NOTICES-qizhang_player_leash.md': file('THIRD_PARTY_NOTICES.md'),
]

def targetMatrix = [
        "fabric-1.21.1"  : [loader: "fabric",   loomPlatform: "fabric",   minecraft: "1.21.1", java: 21],
        "neoforge-1.21.1": [loader: "neoforge", loomPlatform: "neoforge", minecraft: "1.21.1", java: 21],
        "forge-1.21.1"   : [loader: "forge",    loomPlatform: "forge",    minecraft: "1.21.1", java: 21],
        "fabric-1.20.1"  : [loader: "fabric",   loomPlatform: "fabric",   minecraft: "1.20.1", java: 17],
        // NeoForge 1.20.1 was the short-lived Forge-compatible 47.x line. It must use
        // Loom's legacy Forge pipeline and net.neoforged:forge, not modern NeoForge.
        "neoforge-1.20.1": [loader: "neoforge", loomPlatform: "forge",    minecraft: "1.20.1", java: 17],
        "forge-1.20.1"   : [loader: "forge",    loomPlatform: "forge",    minecraft: "1.20.1", java: 17],
]

ext.targetMatrix = targetMatrix

allprojects {
    group = mod_group_id
    version = mod_version
}

subprojects { targetProject ->
    def target = targetMatrix[targetProject.name]
    if (target == null) {
        throw new GradleException("Unknown build target: ${targetProject.path}")
    }

    apply plugin: "dev.architectury.loom"

    loom {
        silentMojangMappingsLicense()
    }

    base {
        archivesName = "${rootProject.archives_name}-${target.loader}-${target.minecraft}"
    }

    repositories {
        mavenCentral()
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.minecraftforge.net/" }
        maven { url "https://maven.neoforged.net/releases/" }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${target.minecraft}"
        mappings loom.officialMojangMappings()

        if (target.loader == "fabric") {
            modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
            def apiVersion = target.minecraft == "1.21.1"
                    ? rootProject.fabric_api_121_version
                    : rootProject.fabric_api_120_version
            modImplementation "net.fabricmc.fabric-api:fabric-api:${apiVersion}"
        } else if (target.loader == "neoforge" && target.minecraft == "1.21.1") {
            neoForge "net.neoforged:neoforge:${rootProject.neoforge_121_version}"
        } else if (target.loader == "neoforge") {
            forge "net.neoforged:forge:${rootProject.neoforge_120_version}"
        } else if (target.minecraft == "1.21.1") {
            forge "net.minecraftforge:forge:${target.minecraft}-${rootProject.forge_121_version}"
        } else {
            forge "net.minecraftforge:forge:${target.minecraft}-${rootProject.forge_120_version}"
        }
    }

    sourceSets {
        main {
            def javaDirectories = [
                    rootProject.file("common/src/main/java"),
                    rootProject.file("versions/${target.minecraft}/src/main/java"),
                    targetProject.file("src/main/java"),
            ]
            if (target.minecraft == "1.20.1" && target.loader != "fabric") {
                javaDirectories.add(rootProject.file("platforms/forgelike-1.20.1/src/main/java"))
            }
            java.setSrcDirs(javaDirectories)
            resources.setSrcDirs([
                    rootProject.file("common/src/main/resources"),
                    rootProject.file("versions/${target.minecraft}/src/main/resources"),
                    targetProject.file("src/main/resources"),
            ])
        }
        test {
            java.setSrcDirs([
                    rootProject.file("common/src/test/java"),
                    rootProject.file("versions/${target.minecraft}/src/test/java"),
                    targetProject.file("src/test/java"),
            ])
            resources.setSrcDirs([
                    rootProject.file("common/src/test/resources"),
                    rootProject.file("versions/${target.minecraft}/src/test/resources"),
                    targetProject.file("src/test/resources"),
            ])
        }
    }

    loom {
        mixin {
            useLegacyMixinAp = true
            defaultRefmapName = "qizhang-player-leash.refmap.json"
        }
        if (target.loomPlatform == "forge") {
            forge {
                mixinConfig "qizhang-player-leash.mixins.json"
            }
        }
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(target.java as int)
    }

    tasks.withType(JavaExec).configureEach {
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(target.java as int)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = target.java as int
    }

    def replaceProperties = [
            mod_id                 : rootProject.mod_id,
            mod_name               : rootProject.mod_name,
            mod_version            : rootProject.mod_version,
            mod_license            : rootProject.mod_license,
            mod_authors            : rootProject.mod_authors,
            mod_description        : rootProject.mod_description,
            minecraft_version      : target.minecraft,
            java_version           : target.java,
            fabric_loader_version  : rootProject.fabric_loader_version,
            fabric_api_version     : target.minecraft == "1.21.1"
                    ? rootProject.fabric_api_121_version
                    : rootProject.fabric_api_120_version,
            forge_version          : target.minecraft == "1.21.1"
                    ? rootProject.forge_121_version
                    : rootProject.forge_120_version,
            neoforge_version       : target.minecraft == "1.21.1"
                    ? rootProject.neoforge_121_version
                    : rootProject.neoforge_120_version,
    ]

    tasks.named("processResources", ProcessResources) {
        inputs.properties replaceProperties
        filesMatching(["fabric.mod.json", "META-INF/mods.toml", "META-INF/neoforge.mods.toml"]) {
            expand replaceProperties
        }
    }

    tasks.named("jar", Jar) {
        packagedLegalFiles.each { packagedPath, sourceFile ->
            from(sourceFile) {
                into packagedPath.substring(0, packagedPath.lastIndexOf('/'))
                rename { packagedPath.substring(packagedPath.lastIndexOf('/') + 1) }
            }
        }
        manifest {
            attributes(
                    "Implementation-Title": rootProject.mod_name,
                    "Implementation-Version": rootProject.mod_version,
                    "MixinConfigs": "qizhang-player-leash.mixins.json",
            )
        }
    }

    tasks.named("remapJar") {
        archiveFileName.set("${rootProject.archives_name}-${target.loader}-${target.minecraft}-${rootProject.mod_version}.jar")
    }

    tasks.register("selfTest", JavaExec) {
        group = "verification"
        description = "Runs deterministic rule-store and taming-schedule checks for ${targetProject.name}."
        dependsOn tasks.named("testClasses")
        classpath = sourceSets.test.runtimeClasspath
        mainClass = "qizhang.playerleash.LeashRuleStoreSelfTest"
    }

    tasks.named("check") {
        dependsOn tasks.named("selfTest")
    }
}

tasks.register("verifyLicensing") {
    group = "verification"
    description = "Checks canonical license texts, file-scoped policy, SPDX coverage, asset records, and Wrapper exception."
    inputs.files packagedLegalFiles.values()
    inputs.files(fileTree('.') {
        include 'common/src/**/*.java'
        include 'versions/*/src/**/*.java'
        include 'platforms/*/src/**/*.java'
    })
    inputs.files(
            file('build.gradle'),
            file('settings.gradle'),
            file('gradle.properties'),
            file('.github/workflows/build.yml'),
            file('.github/workflows/dependency-submission.yml'),
            file('tools/Verify-Release.ps1'),
            file('.gitattributes'),
            file('.gitignore'),
            file('.reuse/dep5'),
            fileTree('platforms') {
                include '**/gradle.properties'
                include '**/*.toml'
            },
            file('gradlew'),
            file('gradlew.bat'),
            file('gradle/wrapper/gradle-wrapper.jar'),
            file('gradle/wrapper/gradle-wrapper.properties'),
    )

    doLast {
        def sha256 = { File source ->
            java.security.MessageDigest.getInstance('SHA-256')
                    .digest(source.bytes).encodeHex().toString().toUpperCase(Locale.ROOT)
        }

        // Exact UTF-8/LF texts fixed for this transition.
        def expectedLegalHashes = [
                (file('LICENSE')): '996AF0513DF21F7496288951C41428A03C174E9E4A9D63665C57D670F845CCB1',
                (file('LICENSES/MIT.txt')): 'D1C643C0E48132A554BDF978BB863665F6C2F2099989366DD1EEAEEF549309A4',
                (file('LICENSES/CC-BY-SA-4.0.txt')): 'CDE7883B9050A1104F4AC19A1572AAFD6E5D7323B68351AAF51FBF4BEBA54966',
                (file('LICENSES/Apache-2.0.txt')): '074E6E32C86A4C0EF8B3ED25B721CA23ACA83DF277CD88106EF7177C354615FF',
        ]
        expectedLegalHashes.each { source, expected ->
            if (sha256(source) != expected) {
                throw new GradleException("Canonical or preserved license text changed: ${source}")
            }
        }

        def javaSources = fileTree('.') {
            include 'common/src/**/*.java'
            include 'versions/*/src/**/*.java'
            include 'platforms/*/src/**/*.java'
        }
        javaSources.files.each { source ->
            if (!source.readLines('UTF-8').take(3).contains('// SPDX-License-Identifier: LGPL-3.0-or-later')) {
                throw new GradleException("Missing project SPDX header: ${source}")
            }
        }

        def projectHeaderFiles = [
                file('build.gradle'),
                file('settings.gradle'),
                file('gradle.properties'),
                file('.github/workflows/build.yml'),
                file('.github/workflows/dependency-submission.yml'),
                file('tools/Verify-Release.ps1'),
                file('.gitattributes'),
                file('.gitignore'),
        ]
        projectHeaderFiles.addAll(fileTree('platforms') {
            include '**/gradle.properties'
            include '**/*.toml'
        }.files)
        projectHeaderFiles.addAll(fileTree('.') {
            include '*.md'
            include 'docs/*.md'
            include 'art/generated/*.md'
        }.files)
        projectHeaderFiles.each { source ->
            if (!source.readLines('UTF-8').take(3).any { it.contains('SPDX-License-Identifier: LGPL-3.0-or-later') }) {
                throw new GradleException("Missing project SPDX header: ${source}")
            }
        }

        def expectedAssets = [
                (file('art/players-tether-icon-source.png')): '60F365BF8A51C0E8EC37014A5C32376DCA79DF21A1F21EC2E286898E2C803F1E',
                (file('common/src/main/resources/players_tether_icon.png')): 'DE025391AEFDEE814DE509B41393F7CD21583DFC3FB9243B3A4D70AE78E51C29',
                (file('docs/assets/players_tether_icon.png')): 'DE025391AEFDEE814DE509B41393F7CD21583DFC3FB9243B3A4D70AE78E51C29',
                (file('art/generated/tamed-effect-source.png')): '590300FF87BA43D8E8D5F1A23875C7A5709A60D28DCFB2D732464645B0AB7AF6',
                (file('common/src/main/resources/assets/qizhang_player_leash/textures/mob_effect/tamed.png')): '7F6FBB7CFA2F6A277EE7F1E39A4CDAD701CC2461936CD66986FF15BA69A00B46',
        ]
        def assetInventory = file('ASSET_LICENSES.md').getText('UTF-8')
        expectedAssets.each { source, expected ->
            if (sha256(source) != expected || !assetInventory.contains(expected)) {
                throw new GradleException("Recorded asset changed without an inventory update: ${source}")
            }
        }
        [
                file('art/players-tether-icon-source.png'),
                file('art/generated/tamed-effect-source.png'),
        ].each { source ->
            def provenanceBytes = new String(source.bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
            ['c2pa.created', 'gpt-image', 'trainedAlgorithmicMedia', 'OpenAI Media Service API'].each { marker ->
                if (!provenanceBytes.contains(marker)) {
                    throw new GradleException("Generated-image provenance marker changed for ${source}: ${marker}")
                }
            }
        }

        if (sha256(file('common/src/main/resources/assets/qizhang_player_leash/textures/mob_effect/tamed.png')) == 'F5F2A37E7466F2983C00550874A2A94D2D006EAE52B0E73ACB722FADEB9BDB3B') {
            throw new GradleException('Historical Minecraft bone texture must not be redistributed')
        }
        if (providers.gradleProperty('mod_license').get() != 'LGPL-3.0-or-later AND MIT AND CC-BY-SA-4.0') {
            throw new GradleException('mod_license must describe the LGPL, MIT, and CC BY-SA package components')
        }
        if (!file('LICENSE_POLICY.md').getText('UTF-8').contains('v1.0.0` through `v1.1.5')) {
            throw new GradleException('Historical MIT transition boundary is missing')
        }
        if (!file('gradlew').getText('UTF-8').contains('https://www.apache.org/licenses/LICENSE-2.0')
                || !file('gradlew.bat').getText('UTF-8').contains('https://www.apache.org/licenses/LICENSE-2.0')) {
            throw new GradleException('Gradle Wrapper launch-script license notice changed')
        }
        if (sha256(file('gradle/wrapper/gradle-wrapper.jar')) != '7D3A4AC4DE1C32B59BC6A4EB8ECB8E612CCD0CF1AE1E99F66902DA64DF296172') {
            throw new GradleException('Unexpected Gradle Wrapper JAR; review its license before updating')
        }
        if (!file('gradle/wrapper/gradle-wrapper.properties').getText('UTF-8').contains('gradle-8.14.1-bin.zip')) {
            throw new GradleException('Gradle Wrapper version changed; update THIRD_PARTY_NOTICES.md')
        }

        def dep5 = file('.reuse/dep5').getText('UTF-8')
        [
                'common/src/main/resources/assets/qizhang_player_leash/lang/*.json',
                'platforms/fabric-1.20.1/src/main/resources/fabric.mod.json',
                'versions/1.20.1/src/main/resources/pack.mcmeta',
                'gradle/wrapper/gradle-wrapper.jar',
                'art/players-tether-icon-source.png',
                'art/generated/tamed-effect-source.png',
        ].each { boundary ->
            if (!dep5.contains(boundary)) {
                throw new GradleException("Machine-readable license boundary is missing from .reuse/dep5: ${boundary}")
            }
        }

        logger.lifecycle("LICENSE_VERIFY=PASS javaSpdx=${javaSources.files.size()}/${javaSources.files.size()} projectHeaders=${projectHeaderFiles.size()}/${projectHeaderFiles.size()} assets=${expectedAssets.size()}/${expectedAssets.size()} dep5=PASS")
    }
}

tasks.register("buildAll") {
    group = "build"
    description = "Builds and verifies all six loader/version targets."
    dependsOn tasks.named("verifyLicensing")
    dependsOn subprojects.collect { it.tasks.named("build") }
}

tasks.register("collectReleaseJars", Sync) {
    group = "distribution"
    description = "Collects the six remapped production JARs under build/release."
    dependsOn tasks.named("verifyLicensing")
    dependsOn subprojects.collect { it.tasks.named("remapJar") }
    into layout.buildDirectory.dir("release")
    subprojects.each { targetProject ->
        from(targetProject.tasks.named("remapJar").flatMap { it.archiveFile })
    }
}

tasks.named("check") {
    dependsOn tasks.named("verifyLicensing")
}
