pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.minecraftforge.net/" }
        maven { url "https://maven.neoforged.net/releases/" }
        gradlePluginPortal()
    }
}

plugins {
    id "org.gradle.toolchains.foojay-resolver-convention" version "1.0.0"
}

rootProject.name = "players-tether-easter-egg-version"

[
        "fabric-1.21.1",
        "neoforge-1.21.1",
        "forge-1.21.1",
        "fabric-1.20.1",
        "neoforge-1.20.1",
        "forge-1.20.1",
].each { targetName ->
    include targetName
    project(":${targetName}").projectDir = file("platforms/${targetName}")
}
