name: Dependency graph

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit-gradle-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6
        with:
          # Only report dependencies explicitly embedded by Fabric's `include`
          # or the Forge-family jar-in-jar configuration. Minecraft and loader
          # development classpaths are provided by the target runtime.
          dependency-graph-include-configurations: '^include$|^jarJar$'
