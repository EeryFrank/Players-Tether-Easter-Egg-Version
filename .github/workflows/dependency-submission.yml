name: Dependency graph

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit-gradle-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6
        with:
          # The published mod contains only dependencies explicitly embedded
          # through NeoForge's jar-in-jar configuration. Excluding the
          # Minecraft/NeoForge development classpaths prevents their runtime
          # libraries from being attributed to this mod artifact.
          dependency-graph-include-configurations: '^jarJar$'
