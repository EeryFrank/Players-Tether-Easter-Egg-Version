name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  license:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify license boundaries
        run: ./gradlew --no-daemon --console=plain verifyLicensing

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - fabric-1.20.1
          - fabric-1.21.1
          - forge-1.20.1
          - forge-1.21.1
          - neoforge-1.20.1
          - neoforge-1.21.1
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test ${{ matrix.target }}
        run: ./gradlew --no-daemon --console=plain ":${{ matrix.target }}:clean" ":${{ matrix.target }}:build"

      - name: Upload production JAR
        uses: actions/upload-artifact@v4
        with:
          name: players-tether-${{ matrix.target }}
          path: platforms/${{ matrix.target }}/build/libs/*.jar
          if-no-files-found: error

  verify-release:
    needs: [build, license]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download six production JARs
        uses: actions/download-artifact@v5
        with:
          pattern: players-tether-*
          merge-multiple: true
          path: build/release

      - name: Verify release bundle and write SHA-256 manifest
        shell: pwsh
        run: ./tools/Verify-Release.ps1

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v4
        with:
          name: players-tether-easter-egg-version-release
          path: build/release/*
          if-no-files-found: error
