# SPDX-License-Identifier: LGPL-3.0-or-later

modLoader = "javafml"
loaderVersion = "[4,)"
license = "${mod_license}"
issueTrackerURL = "https://github.com/EeryFrank/Players-Tether-Easter-Egg-Version/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
logoFile = "players_tether_icon.png"
displayURL = "https://github.com/EeryFrank/Players-Tether-Easter-Egg-Version"
description = '''${mod_description}'''

[[mixins]]
config = "qizhang-player-leash.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},21.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"

# Optional NeoForge 1.21.1 compatibility boundary. Player's Tether owns
# player targets while QiZhang Aquaculture Turtle Companion owns non-player
# living targets, so deterministic ordering avoids competing interactions.
[[dependencies.${mod_id}]]
modId = "qizhang_aquaculture_turtle_companion"
type = "optional"
versionRange = "[1.0.0,)"
ordering = "BEFORE"
side = "SERVER"
